name: security-scan
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "17 3 * * 1" }] # weekly: new CVEs/rules appear without any code change
permissions: {}

jobs:
  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@REPLACE_WITH_FULL_SHA # v4
        with: { persist-credentials: false }
      - uses: aquasecurity/trivy-action@REPLACE_WITH_FULL_SHA # 0.28+
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@REPLACE_WITH_FULL_SHA # v3
        if: always()
        with: { sarif_file: trivy.sarif }

  checkov:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@REPLACE_WITH_FULL_SHA # v4
        with: { persist-credentials: false }
      - uses: bridgecrewio/checkov-action@REPLACE_WITH_FULL_SHA # v12
        with:
          directory: .
          config_file: .checkov.yml

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@REPLACE_WITH_FULL_SHA # v4
        with: { fetch-depth: 0, persist-credentials: false } # full history: secrets hide in old commits
      - uses: aquasecurity/trivy-action@REPLACE_WITH_FULL_SHA # 0.28+
        with: { scan-type: fs, scanners: secret, exit-code: "1" }
